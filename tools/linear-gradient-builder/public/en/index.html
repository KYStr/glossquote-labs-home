<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Build an ordered linear gradient and export CSS; inputs stay in page memory."><title>Linear Gradient Builder</title><link rel="stylesheet" href="../style.css"><script type="module" src="../app.mjs"></script></head>
<body><main><nav><a id="home" data-text="home" href="https://glossquote.com/index.html">GlossQuote</a><a id="language" data-text="language" href="../index.html">Language</a></nav><header><p class="eyebrow">GLOSSQUOTE LABS · PREVIEW</p><h1 data-text="title">Linear Gradient Builder</h1><p data-text="intro"></p></header><p id="limits">2–8 · #RRGGBB · 0–359° · 0–100%</p><p data-text="privacy"></p><p id="status" role="status" aria-live="polite">Loading…／載入中…</p>
<form id="form" novalidate><fieldset id="work" disabled><legend data-text="title"></legend><label for="angle" data-text="angle"></label><input id="angle" type="text" inputmode="numeric" autocomplete="off" aria-describedby="status limits" value="90"><p id="stop-count" aria-live="polite"></p><div id="stops"></div><div class="actions"><button id="add" type="button" data-text="add"></button><button id="generate" type="submit" data-text="generate"></button><button id="clear" type="button" data-text="clear"></button></div>
<section id="result" hidden><h2 data-text="preview"></h2><div id="gradient-preview" role="img" aria-describedby="summary" aria-label="Gradient / 漸層"></div><h3 data-text="summary"></h3><p id="summary"></p><label for="css" data-text="output"></label><textarea id="css" readonly rows="7" spellcheck="false"></textarea><div class="actions"><button id="copy" type="button" data-text="copy" disabled></button><button id="download" type="button" data-text="download" disabled></button><button id="select" type="button" data-text="select" disabled></button></div></section></fieldset></form><section><h2 data-text="faqTitle"></h2><div id="faq"></div></section><dialog id="dialog" aria-labelledby="confirm-title"><h2 id="confirm-title" data-text="confirm"></h2><button id="keep" type="button" data-text="keep"></button><button id="accept" type="button" data-text="accept"></button></dialog><noscript>JavaScript is required.／需要啟用 JavaScript。</noscript></main></body></html>
