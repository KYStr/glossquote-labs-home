<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="以兩個 rem 端點計算流動字級 CSS。A private fluid typography calculator preview."><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>流動字級 · Fluid type</title><link rel="stylesheet" href="./style.css"><script type="module" src="./src/app.mjs"></script></head><body>
<header><a class="wordmark" href="#main">GQ<span>LABS</span></a><button id="language" type="button">English</button></header>
<main id="main"><div class="heading"><p class="eyebrow" data-t="eyebrow">GLOSSQUOTE LABS · CSS 小工具</p><h1 data-t="title">流動字級</h1><p class="intro" data-t="intro">一行 CSS，讓字級在兩個端點之間自然成長。</p></div>
<noscript><p class="notice">此計算器需要 JavaScript。未啟用時不會產生結果。 This calculator requires JavaScript; no result is generated while disabled.</p></noscript>
<div class="workspace"><section class="panel settings" aria-labelledby="inputTitle"><div class="section-head"><span class="step">01</span><h2 id="inputTitle" data-t="inputTitle">設定兩端的尺寸</h2></div><p class="muted" data-t="inputHint">以 rem 定義設計端點，不是固定像素斷點。</p>
<form id="form" novalidate><div class="field-grid" id="numeric-fields"></div><p id="root-hint" class="muted small" data-t="rootHint"></p><div class="field"><label for="sample" data-t="sample">試讀文字</label><textarea id="sample" rows="3" aria-describedby="sample-hint sample-error" spellcheck="false"></textarea><p id="sample-hint" class="muted small" data-t="sampleHint"></p><p id="sample-error" class="error" hidden></p><span id="sample-count" class="count" aria-hidden="true"></span></div><div class="actions"><button class="primary" id="generate" type="submit" data-t="generate">產生 CSS</button></div></form></section>
<section class="panel results" aria-labelledby="outputTitle"><div class="section-head"><span class="step">02</span><h2 id="outputTitle" data-t="outputTitle">你的字級規則</h2></div><p id="empty" class="empty" data-t="empty"></p><div id="result-content" hidden><label for="css" data-t="cssLabel"></label><textarea id="css" rows="4" tabindex="-1" readonly spellcheck="false" aria-describedby="select-hint"></textarea></div><div class="actions"><button id="select" type="button" disabled data-t="select">選取 CSS</button><button id="reset" type="button" data-t="reset">重設</button></div><p id="select-hint" class="muted small" data-t="selectHint"></p><div id="details" hidden><div class="metrics"><div><span data-t="state"></span><strong id="state"></strong></div><div><span data-t="font"></span><strong id="size"></strong></div></div><p id="root-note" class="muted small"></p><table><caption data-t="design"></caption><thead><tr><th scope="col"></th><th scope="col" data-t="viewport"></th><th scope="col" data-t="font"></th></tr></thead><tbody id="table-body"></tbody></table><p class="muted small" data-t="roundNote"></p></div></section></div>
<section class="panel preview-section" aria-labelledby="previewTitle"><div class="section-head"><span class="step">03</span><h2 id="previewTitle" data-t="previewTitle">試讀與換算</h2></div><p class="muted" data-t="previewHint"></p><div class="preview-frame"><p id="preview"></p></div></section>
<details class="help"><summary data-t="helpTitle">怎麼使用？</summary><p data-t="help"></p></details><p id="live" class="sr-only" aria-live="polite" aria-atomic="true"></p></main><footer data-t="privacy">只在此頁計算 · 無帳號、追蹤、儲存或下載</footer></body></html>
