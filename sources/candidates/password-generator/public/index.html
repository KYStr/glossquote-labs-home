<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>密碼產生與強度檢查 | GlossQuote 工具</title>
<meta name="description" content="在本機產生隨機密碼與口令片語，並用公開的估計模型檢查密碼強度：熵與每一項扣分都列出來。全部在你的裝置上運算，不上傳、不儲存。">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14532d">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="alternate" hreflang="zh-Hant" href="./index.html">
<link rel="alternate" hreflang="en" href="./en/index.html">
<link rel="alternate" hreflang="x-default" href="./index.html">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
<script type="module" src="js/app.mjs"></script>
</head>
<body>
<header class="site-header">
  <nav class="site-nav" aria-label="主要導覽">
    <a data-home-link href="https://glossquote.com/index.html">GlossQuote 首頁</a>
    <a href="en/index.html" lang="en">English</a>
  </nav>
</header>
<main class="page">
  <h1>密碼產生與強度檢查</h1>
  <p class="intro">用瀏覽器的加密亂數（crypto.getRandomValues）在本機產生密碼與口令片語，不上傳、不儲存、關閉分頁就消失。強度數字是依本頁公開模型算出的估計，不是保證；產生的密碼請存進可靠的密碼管理器，本工具不保存任何東西。也提醒：密碼顯示在螢幕上時，截圖或身後的人仍可能看到。</p>

  <p id="crypto-warning" class="error" role="alert" hidden></p>

  <section class="card">
    <div class="tabs" role="tablist" aria-label="模式">
      <button type="button" id="tab-password" role="tab" aria-selected="true">隨機密碼</button>
      <button type="button" id="tab-passphrase" role="tab" aria-selected="false">口令片語</button>
      <button type="button" id="tab-check" role="tab" aria-selected="false">強度檢查</button>
    </div>

    <div id="panel-password">
      <div class="field">
        <label for="pw-length">長度（8–128）</label>
        <input id="pw-length" type="number" min="8" max="128" step="1" value="20">
      </div>
      <fieldset class="field">
        <legend>字元集</legend>
        <label><input id="pw-lower" type="checkbox" checked> 小寫字母 a–z</label>
        <label><input id="pw-upper" type="checkbox" checked> 大寫字母 A–Z</label>
        <label><input id="pw-digits" type="checkbox" checked> 數字 0–9</label>
        <label><input id="pw-symbols" type="checkbox" checked> 符號</label>
        <label><input id="pw-no-ambiguous" type="checkbox"> 排除易混淆字元（l、I、1、O、0）</label>
      </fieldset>
      <div class="field">
        <label for="pw-count">一次產生數量（1–10）</label>
        <input id="pw-count" type="number" min="1" max="10" step="1" value="1">
      </div>
      <p class="expected">預期熵：<span id="pw-expected"></span> 位元</p>
      <p id="pw-replace-note" class="note"></p>
      <button type="button" id="pw-generate" class="primary">產生</button>
      <p id="pw-error" class="error" role="alert"></p>
      <div id="pw-list" class="secret-list"></div>
    </div>

    <div id="panel-passphrase" hidden>
      <div class="field">
        <label for="pp-words">單字數（3–10）</label>
        <input id="pp-words" type="number" min="3" max="10" step="1" value="5">
      </div>
      <div class="field">
        <label for="pp-separator">分隔符號</label>
        <select id="pp-separator">
          <option value="hyphen" selected>連字號 -</option>
          <option value="space">空白</option>
          <option value="underscore">底線 _</option>
          <option value="dot">句點 .</option>
          <option value="none">無</option>
        </select>
      </div>
      <fieldset class="field">
        <legend>選項</legend>
        <label><input id="pp-capitalize" type="checkbox"> 其中一個單字首字母大寫</label>
        <label><input id="pp-digit" type="checkbox"> 結尾加一個隨機數字</label>
      </fieldset>
      <div class="field">
        <label for="pp-count">一次產生數量（1–10）</label>
        <input id="pp-count" type="number" min="1" max="10" step="1" value="1">
      </div>
      <p class="expected">預期熵：<span id="pp-expected"></span> 位元</p>
      <p id="pp-replace-note" class="note"></p>
      <button type="button" id="pp-generate" class="primary">產生</button>
      <p id="pp-error" class="error" role="alert"></p>
      <div id="pp-list" class="secret-list"></div>
    </div>

    <div id="panel-check" hidden>
      <div class="field">
        <label for="check-input">要檢查的密碼</label>
        <input id="check-input" type="password" autocomplete="off" spellcheck="false">
        <button type="button" id="check-toggle">顯示／隱藏</button>
      </div>
      <p id="check-error" class="error" role="alert"></p>
      <div id="check-breakdown"></div>
      <p id="check-final" class="final"></p>
      <p class="note">這是依公開模型（基礎熵減去逐項扣分）算出的估計，不是安全保證，也不會把你輸入的密碼顯示在結果裡。</p>
    </div>
  </section>

  <p>
    <button type="button" id="wipe-button">全部清除</button>
    <span id="status-note" class="note"></span>
  </p>
  <p id="announce" class="visually-hidden" aria-live="polite"></p>
</main>
</body>
</html>
