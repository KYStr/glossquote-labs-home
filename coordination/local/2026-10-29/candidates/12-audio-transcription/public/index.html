<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="短音檔本機逐字稿的技術驗證預覽。規劃支援30秒內的中文普通話與英文 PCM16 WAV，完整辨識驗收尚未完成。">
  <title>短音檔本機逐字稿｜GlossQuote-Labs 技術預覽</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <script type="module" src="js/app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="topbar"><a href="https://glossquote.com/index.html">GlossQuote-Labs</a><span>技術預覽</span></header>
  <main id="main">
    <h1>短音檔本機逐字稿</h1>
    <p>將一段短語音轉成可複製的文字。</p>
    <section class="workspace" aria-labelledby="preview-heading">
      <h2 id="preview-heading">辨識功能尚未開放</h2>
      <p id="status" role="status">正在確認技術預覽狀態。</p>
      <p>模型仍待雙語準確度、速度、記憶體、取消及離線實測。此頁目前不接受音檔。</p>
    </section>
    <section class="limits" aria-labelledby="limits-heading">
      <h2 id="limits-heading">預定範圍</h2>
      <p>單一 PCM16 WAV，最多30秒／10 MiB，16、44.1或48 kHz，單聲道或雙聲道。辨識語言為中文普通話與英文。</p>
      <p>模型可能輸出繁體或簡體；辨識結果需要核對。第一版不包含 MP3、錄音、字幕或講者分離。</p>
    </section>
  </main>
</body>
</html>
